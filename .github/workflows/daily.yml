name: Daily New Releases

on:
  # GitHub's scheduler is best-effort and runs on UTC only. Israel is UTC+2 in
  # winter / UTC+3 in summer, so 00:00–01:00 UTC is the band that lands inside
  # 02:00–04:00 local all year — but 00:00 UTC is also the most oversubscribed
  # minute on all of Actions (it's everyone's default "midnight" cron), and in
  # practice runs here have landed ~3h late, around 03:00–04:00 UTC instead of
  # 00:00–01:00. These entries are pulled back ~3h, to 21:00–22:00 UTC the
  # prior day, so the delayed actual fire time lands back in the intended
  # window. Off-round minutes avoid the worst queue spikes; the first attempt
  # that succeeds makes the rest no-ops.
  schedule:
    - cron: '7 21 * * *'   # targets ~00:07 UTC actual / 02:07 IST / 03:07 IDT
    - cron: '37 21 * * *'  # targets ~00:37 UTC actual / 02:37 IST / 03:37 IDT
  workflow_dispatch:

# Queue overlapping attempts instead of running them side by side, so a slow
# run can't race a later one into adding the same tracks twice.
concurrency:
  group: daily-new-releases
  cancel-in-progress: false

permissions:
  contents: write # for the keepalive commit in the last step
  actions: read # for the "already succeeded today" lookup below

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Runs on every event, including workflow_dispatch, so a manual run is a
      # live test of the lookup below. Only schedule events actually skip.
      - name: Skip if a scheduled run already succeeded today
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          today=$(date -u +%F)
          # Fail open: if the lookup breaks, run the script rather than lose the
          # day. Re-running is harmless — it filters out URIs already present.
          prior=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow daily.yml \
            --event schedule \
            --status success \
            --limit 20 \
            --json createdAt \
            --jq "[.[] | select(.createdAt | startswith(\"$today\"))] | length" 2>&1) || {
              echo "Guard lookup failed, running anyway: $prior"
              prior=0
            }
          case "$prior" in
            ''|*[!0-9]*) echo "Unexpected guard output '$prior', running anyway."; prior=0 ;;
          esac

          echo "$prior successful scheduled run(s) so far today ($today)."
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "Manual run — never skips."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ "$prior" -gt 0 ]; then
            echo "Today's work is already done — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing succeeded yet today — proceeding."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v7
        with:
          # Full history: pushing the keepalive commit from a shallow clone can
          # be rejected with "shallow update not allowed".
          fetch-depth: 0

      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Write token cache
        if: steps.guard.outputs.skip != 'true'
        env:
          SPOTIFY_TOKEN_CACHE: ${{ secrets.SPOTIFY_TOKEN_CACHE }}
        run: echo "$SPOTIFY_TOKEN_CACHE" > "$RUNNER_TEMP/spotify_token_cache.json"

      - name: Run script
        if: steps.guard.outputs.skip != 'true'
        env:
          SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
          SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}
          SPOTIPY_REDIRECT_URI: ${{ secrets.SPOTIPY_REDIRECT_URI }}
          SPOTIFY_TOKEN_CACHE_PATH: ${{ runner.temp }}/spotify_token_cache.json
        run: python new_release_main.py

      # Runs even if the script above failed: the 60-day inactivity clock counts
      # commits, not workflow runs, so a broken script would otherwise take the
      # schedule down with it.
      - name: Keepalive (schedules auto-disable after 60 idle days)
        if: ${{ !cancelled() && steps.guard.outputs.skip != 'true' }}
        run: |
          age=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          if [ "$age" -ge 50 ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive"
            git push
            echo "Last commit was ${age}d ago — pushed an empty keepalive commit."
          else
            echo "Last commit ${age}d ago — no keepalive needed."
          fi
